<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Kiteezi Recreational Center - Admin</title>

    <link rel="stylesheet" href="admin.css">

</head>

<body>

<div class="admin-container">

    <header class="admin-header">

        <div>
            <h1>Kiteezi Recreational Center</h1>
            <p>Website Media Manager</p>
        </div>

    </header>


    <!-- =========================
         LOGIN
    ========================== -->

    <section id="login-section" class="admin-card">

        <h2>Administrator Login</h2>

        <input
            type="email"
            id="admin-email"
            placeholder="Admin email"
        >

        <input
            type="password"
            id="admin-password"
            placeholder="Password"
        >

        <button id="login-button">
            Login
        </button>

        <p id="login-message"></p>

    </section>


    <!-- =========================
         ADMIN PANEL
    ========================== -->

    <section id="admin-panel" style="display:none;">

        <div class="admin-topbar">

            <div>
                <h2>Manage Website Media</h2>

                <p>
                    Change images and videos displayed on your website.
                </p>
            </div>

            <button id="logout-button"
                    class="logout-button">
                Logout
            </button>

        </div>


        <!-- =========================
             UPLOAD AREA
        ========================== -->

        <div class="admin-card">

            <h3>Upload or Replace Media</h3>


            <label for="media-area">
                Website Area
            </label>

            <select id="media-area">

                <option value="">
                    Select website area
                </option>

                <option value="hero">
                    Hero Background
                </option>

                <option value="about">
                    About Section
                </option>
    
                <option value="swimming">
                    Swimming
                </option>
                 
                <option value="sports">
                    Sports Video
                </option>

                <option value="events">
                    Events
                </option>

                <option value="restaurant">
                    Restaurant
                </option>
                <option value="restaurant 2">
                    Restaurant 
                </option>
                <option value="food">
                    Food
                </option>

                <option value="coffee">
                    Coffee
                </option>

                <option value="snacks">
                    Snacks
                </option>

                <option value="goat">
                    Goat
                </option>

                <option value="liver">
                    Liver
                </option>

                <option value="chicken">
                    Chicken
                </option>

                <option value="burger">
                    Burger
                </option>

                <option value="rice">
                    Rice
                </option>

                <option value="pizza">
                    Pizza
                </option>

                <option value="fish">
                    Fish
                </option>

                <option value="logo">
                    Website Logo
                </option>

            </select>


            <label for="media-type">
                Media Type
            </label>

            <select id="media-type">

                <option value="">
                    Select media type
                </option>

                <option value="image">
                    Image
                </option>

                <option value="video">
                    Video
                </option>

            </select>


            <label for="media-file">
                Choose File
            </label>

            <input
                type="file"
                id="media-file"
                accept="image/*,video/*"
            >


            <button id="upload-button">
                Upload / Replace
            </button>


            <p id="upload-message"></p>

        </div>


        <!-- =========================
             CURRENT MEDIA
        ========================== -->

        <div class="admin-card">

            <div class="media-heading">

                <div>
                    <h3>Current Website Media</h3>

                    <p>
                        Replace or delete anything currently being used.
                    </p>
                </div>

                <button id="refresh-button"
                        class="refresh-button">
                    Refresh
                </button>

            </div>


            <div id="media-list">

                <p class="loading">
                    Loading website media...
                </p>

            </div>

        </div>

    </section>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="admin.js"></script>

</body>

</html>
