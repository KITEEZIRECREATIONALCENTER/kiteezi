<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kiteezi Recreational Centre - Menu</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar">
    <div class="logo">
        <a href="index.html">
            <img src="logo.png" alt="Kiteezi Recreational Centre Logo">
        </a>
    </div>

    <button class="menu-toggle" id="menu-toggle" type="button">
        ☰
    </button>

    <ul class="nav-links" id="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="personel.html">Personnel</a></li>
        <li><a href="index.html#facilities">Facilities</a></li>
        <li><a href="menu.html" class="active">Menu</a></li>
        <li><a href="index.html#reviews">Reviews</a></li>
        <li><a href="index.html#contact">Contact</a></li>
    </ul>
</nav>

<section class="menu-page">

    <div class="menu-hero">
        <h1>Our Menu</h1>

        <p>
            Enjoy our selection of freshly prepared meals,
            snacks, pizzas, burgers and more.
        </p>
    </div>

    <div class="menu-search">
        <input
            type="text"
            id="menu-search"
            placeholder="Search menu..."
        >
    </div>

    <div class="category-buttons">
        <button type="button" class="category-btn active" data-category="all">
            All
        </button>

        <button type="button" class="category-btn" data-category="food">
            Food
        </button>

        <button type="button" class="category-btn" data-category="snacks">
            Snacks
        </button>

        <button type="button" class="category-btn" data-category="pizza">
            Pizza
        </button>

        <button type="button" class="category-btn" data-category="burgers">
            Burgers
        </button>

        <button type="button" class="category-btn" data-category="drinks">
            Drinks
        </button>
    </div>

    <!-- CART BUTTON -->
    <button
        id="cart-button"
        class="cart-button"
        type="button"
        aria-label="Open shopping cart"
    >
        🛒 Cart
        <span id="cart-count">0</span>
    </button>

    <div id="menu-container" class="menu-container">
        <!-- Menu items are loaded by JavaScript -->
    </div>

</section>

<!-- ORDER DRAWER -->
<div id="order-drawer" class="order-drawer">

    <div class="order-drawer-content">

        <button
            id="close-order"
            class="close-order"
            type="button"
            aria-label="Close cart"
        >
            &times;
        </button>

        <h2>Your Order</h2>

        <div class="order-selected">
            <strong>Your Cart</strong>

            <div id="cart-items">
                <p class="cart-empty">
                    Your cart is empty.
                </p>
            </div>
        </div>

        <div class="cart-total">
            <strong>Total:</strong>
            <span id="order-total">UGX 0</span>
        </div>

        <div class="customer-details">

            <label for="customer-name">
                Name
            </label>

            <input
                type="text"
                id="customer-name"
                placeholder="Enter your name"
            >

            <label for="customer-phone">
                Phone
            </label>

            <input
                type="tel"
                id="customer-phone"
                placeholder="Enter your phone number"
            >

            <label for="customer-location">
                Location
            </label>

            <input
                type="text"
                id="customer-location"
                placeholder="Enter your location"
            >

            <label for="customer-note">
                Note
            </label>

            <textarea
                id="customer-note"
                placeholder="Any special instructions?"
            ></textarea>

        </div>

        <button
            id="whatsapp-order"
            class="whatsapp-order"
            type="button"
        >
            Order on WhatsApp
        </button>

    </div>
</div>

<script src="script.js"></script>

</body>
</html>
